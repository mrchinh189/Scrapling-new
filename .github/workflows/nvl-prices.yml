name: NVL prices (daily)

on:
  schedule:
    # 12:07 UTC = 19:07 giờ Việt Nam: sau khi 100ppi (trước 14:00 CST) và Bursa/MPOC (~18:00 MYT) đã có giá
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nvl-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[fetchers]" -r nvl_scraper/requirements.txt
          scrapling install

      - name: Scrape
        run: python -m nvl_scraper --out data

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvl_prices.csv data/nvl_prices.xlsx
          if git diff --cached --quiet; then
            echo "No new prices"
          else
            git commit -m "data: NVL prices $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nvl-prices-${{ github.run_id }}
          path: data/
          retention-days: 30
